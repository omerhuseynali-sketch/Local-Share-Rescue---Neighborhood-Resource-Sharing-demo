<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Share & Rescue - Neighborhood Resource Sharing</title>
    <!-- Google Fonts: Inter font for an editorial, modern, and readable look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div>
            <h1>Local Share & Rescue</h1>
            <p>Neighborhood resource sharing & emergency supply coordination</p>
        </div>
        <div class="counter-badge">
            Active Items:<span id="activeCount">0</span>
        </div>
    </header>

    <div class="main-container">
        <aside class="form-card">
            <h2>Post new Supply</h2>
            <form id="supplyForm">
                <div class="form-group">

                    <label for="title">Title</label>
                    <input type="text" id="title" placeholder="e.g. Cordless Drill with Bits" required>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" rows="3" placeholder="Provide details about the item or rescue offer.."
                        required></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="Food">Food</option>
                            <option value="Tools">Tools</option>
                            <option value="Clothing">Clothing</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="urgency">Urgency Level</label>
                        <select id="urgency" required>
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="donor">Donor / Contact Person</label>
                    <input type="text" id="donor" placeholder="e.g. Sarah M." required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" placeholder="+12 554-0234" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="john@example.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="imgUrl">Photo URL (Optional)</label>
                    <input type="url" id="imgUrl" placeholder="https://images.unsplash...">
                </div>

                <button type="submit" class="btn-submit">Publish Supply</button>

            </form>
        </aside>

        <main>
            <div id="suppliesContainer" class="supplies-grid">
                <!-- Java will dynamically render supply cards here-->
            </div>
        </main>
    </div>

    <script src="app.js"></script>

</body>
</html>
